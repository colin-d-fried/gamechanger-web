name: Lint

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ dev, main ]

jobs:
  eslint-Frontend:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    # See note in test_node.js.yml: there is no frontend/package-lock.json
    # in this repo (yarn.lock is used); removed the cp step that always
    # failed and short-circuited this job.
    - name: Use Node.js '18'
      uses: actions/setup-node@v2
      with:
        node-version: '18'
        registry-url: https://npm.pkg.github.com
        scope: '@dod-advana'
    - run: |
            cd frontend && npm install && npx eslint --ext .js src
      env:
        NODE_AUTH_TOKEN: ${{secrets.NPMRC_FILE}}

  eslint-Backend:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      # See note in test_node.js.yml: there is no backend/package-lock.json
      # in this repo (yarn.lock is used); removed the cp step that always
      # failed and short-circuited this job.
      - name: Use Node.js '18'
        uses: actions/setup-node@v2
        with:
          node-version: '18'
          registry-url: https://npm.pkg.github.com
          scope: '@dod-advana'
      - run: |
          cd backend && npm install && npx eslint --ext .js node_app
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPMRC_FILE}}


